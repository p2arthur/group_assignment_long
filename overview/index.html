<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>

  <body>
    <main class="main-content">
      <section class="left-column">
        <h2 class="place-name">Loading...</h2>
        <section class="weather-container">
          <h2>Weather data</h2>
          <div class="weather-data-container">
            <h3
              class="weather-stats"
              id="weather-stats-1"
            >
              Loading...
            </h3>
            <h3
              class="weather-stats"
              id="weather-stats-2"
            >
              Loading...
            </h3>
            <h3
              class="weather-stats"
              id="weather-stats-3"
            >
              Loading...
            </h3>
            <h3
              class="weather-stats"
              id="weather-stats-4"
            >
              Loading...
            </h3>
            <h3
              class="weather-stats"
              id="weather-stats-5"
            >
              Loading...
            </h3>
            <h3
              class="weather-stats"
              id="weather-stats-6"
            >
              Loading...
            </h3>
          </div>
          <!-- <figure class="temprature weather-object"></figure>
          <figure class="wind-speed weather-object"></figure>
          <figure class="prop-of-prec weather-object"></figure> -->
        </section>
        <section class="cloth-recomendation">
          <div>
            <h4 class="clothes-recomendation-title">
              We recomend you to wear:
            </h4>
          </div>
          <div class="clothes">
            <span
              class="clothes-recomendation"
              id="recomendation-1"
              >Loading...</span
            >
            <span
              class="clothes-recomendation"
              id="recomendation-2"
              >Loading...</span
            >
            <span
              class="clothes-recomendation"
              id="recomendation-3"
              >Loading...</span
            >
          </div>
        </section>
        <section class="other-place">
          <p>Don't like the weather? Try random place!</p>
          <button class="submit-button">Let's go random</button>
        </section>
      </section>

      <section class="right-column">
        <div><h1>Check out the place!</h1></div>
        <div class="video-container">
          <div class="video">
            <iframe
              class="video"
              id="location-video"
              src="https://www.youtube.com/embed/tgbNymZ7vqY"
            >
            </iframe>
          </div>
        </div>
      </section>
    </main>

    <script
      type="module"
      src="overview.js"
    ></script>
  </body>
</html>
