<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>

  <body>
    <main class="main-content">
      <section class="left-column">
        <h2 class="place-name">Loading...</h2>
        <article class="weather-container">
          <h3 id="weather-stats-1">Loading...</h3>
          <h3 id="weather-stats-2">Loading...</h3>
          <h3 id="weather-stats-3">Loading...</h3>
          <!-- <figure class="temprature weather-object"></figure>
          <figure class="wind-speed weather-object"></figure>
          <figure class="prop-of-prec weather-object"></figure> -->
        </article>
        <article class="cloth-recomendation">
          <div>
            <h4>We recomend you to wear:</h4>
          </div>
        </article>
        <article class="other-place">
          <h4>Don't like the weather? Try random place!</h4>
          <button class="submit-button">Let's go random</button>
        </article>
      </section>

      <section class="right-column">
        <div><h1>Check out the place!</h1></div>
        <div class="video-container">
          <div class="video">
            <iframe
              width="700px"
              height="460px"
              id="location-video"
              src="https://www.youtube.com/embed/tgbNymZ7vqY"
            >
            </iframe>
          </div>
        </div>
      </section>
    </main>

    <script
      type="module"
      src="overview.js"
    ></script>
  </body>
</html>
